name: auto-pr-test

# The gate gates itself. Two jobs:
#   check  — deterministic: policy validity, unit tests, ledger integrity. Always runs.
#   gate   — the live review. Runs only when the repo has model credentials
#            (set the AUTO_PR_TEST_LIVE repository variable to "true" and the secrets below).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Policy and registry
        run: auto-pr-test policy-check
      - name: Unit tests
        run: python -m pytest --cov=auto_pr_test --cov-report=term-missing -q
      - name: Ledger integrity
        run: auto-pr-test verify

  gate:
    if: github.event_name == 'pull_request' && vars.AUTO_PR_TEST_LIVE == 'true'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          extras: all
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
