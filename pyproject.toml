[project]
name = "auto-pr-test"
version = "0.1.0"
description = "Policy-as-code PR gate: automated testing, cross-family AI review, and a tamper-evident approval record"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lanier Developments LLC" }]
keywords = ["adlc", "ai-sdlc", "code-review", "ci", "governance", "pull-request"]
dependencies = [
  "pyyaml>=6",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
gemini = ["google-genai>=1.0"]
all = ["auto-pr-test[bedrock,gemini]"]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21"]

[project.scripts]
auto-pr-test = "auto_pr_test.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
